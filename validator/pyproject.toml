[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-catalog-validator"
version = "0.1.0"
description = "Validator for service.json files against the service catalog schema"
requires-python = ">=3.12"
dependencies = [
  # [format-nongpl] pulls in the non-GPL format validators so `uri`/`email`/
  # `date` are actually checked (parity with the web pipeline's ajv-formats),
  # not silently skipped.
  "jsonschema[format-nongpl]>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
service-catalog-validate = "service_catalog_validator.cli:main"
service-catalog-migrate = "service_catalog_validator.migrate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
